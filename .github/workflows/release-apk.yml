name: Build & Release LexiFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Decode Release Keystore (if configured in Secrets)
        if: ${{ secrets.LEXIFLOW_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.LEXIFLOW_KEYSTORE_BASE64 }}" | base64 -d > android/app/lexiflow-release.keystore

      - name: Build Signed Release APK
        env:
          LEXIFLOW_STORE_PASSWORD: ${{ secrets.LEXIFLOW_STORE_PASSWORD }}
          LEXIFLOW_KEY_ALIAS: ${{ secrets.LEXIFLOW_KEY_ALIAS }}
          LEXIFLOW_KEY_PASSWORD: ${{ secrets.LEXIFLOW_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "LexiFlow-${VERSION}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LexiFlow-*.apk
          generate_release_notes: true
