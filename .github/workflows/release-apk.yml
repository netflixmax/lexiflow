name: Build & Release LexiFlow APK (Kokoro + Rime)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Download sherpa-onnx Android AAR (Offline Kokoro Engine)
        run: |
          mkdir -p android/app/libs
          AAR_URL=$(curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest" | grep -o '"browser_download_url": *"[^"]*sherpa-onnx-[0-9][0-9.]*\.aar"' | head -n 1 | cut -d'"' -f 4)
          if [ -z "$AAR_URL" ]; then
            AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar"
          fi
          echo "Downloading AAR: $AAR_URL"
          curl -fL "$AAR_URL" -o android/app/libs/sherpa-onnx.aar
          ls -lh android/app/libs/

      - name: Download Kokoro-82M Offline English Model (int8) + Lexicon
        run: |
          mkdir -p android/app/src/main/assets/kokoro-en
          if ! curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2" -o /tmp/kokoro.tar.bz2; then
            curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-en-v0_19.tar.bz2" -o /tmp/kokoro.tar.bz2
          fi
          rm -rf /tmp/kokoro-extract && mkdir -p /tmp/kokoro-extract
          tar -xjf /tmp/kokoro.tar.bz2 -C /tmp/kokoro-extract
          if [ -f /tmp/kokoro-extract/model.int8.onnx ] || [ -f /tmp/kokoro-extract/model.onnx ]; then
            cp -r /tmp/kokoro-extract/. android/app/src/main/assets/kokoro-en/
          else
            INNER=$(find /tmp/kokoro-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -r "$INNER"/. android/app/src/main/assets/kokoro-en/
          fi
          curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/lexicon-en-us.txt" -o android/app/src/main/assets/kokoro-en/lexicon.txt
          ls -lh android/app/src/main/assets/kokoro-en/
          test -f android/app/src/main/assets/kokoro-en/voices.bin
          test -f android/app/src/main/assets/kokoro-en/tokens.txt
          test -f android/app/src/main/assets/kokoro-en/lexicon.txt
          test -d android/app/src/main/assets/kokoro-en/espeak-ng-data

      - name: Decrypt Release Keystore
        env:
          KEYSTORE_ENC_PASSPHRASE: ${{ secrets.LEXIFLOW_KEYSTORE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in signing/lexiflow-release.keystore.enc \
            -out android/app/lexiflow-release.keystore \
            -pass pass:"$KEYSTORE_ENC_PASSPHRASE"
          test -s android/app/lexiflow-release.keystore

      - name: Build Signed Release APK
        env:
          LEXIFLOW_KEYSTORE_PATH: lexiflow-release.keystore
          LEXIFLOW_STORE_PASSWORD: ${{ secrets.LEXIFLOW_STORE_PASSWORD }}
          LEXIFLOW_KEY_ALIAS: ${{ secrets.LEXIFLOW_KEY_ALIAS }}
          LEXIFLOW_KEY_PASSWORD: ${{ secrets.LEXIFLOW_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare & Verify Release APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.2.0}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "LexiFlow-${VERSION}.apk"
          ls -lh "LexiFlow-${VERSION}.apk"
          sha256sum "LexiFlow-${VERSION}.apk"
          unzip -l "LexiFlow-${VERSION}.apk" | grep "assets/kokoro-en/lexicon.txt"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiFlow-release-apk
          path: LexiFlow-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "LexiFlow ${{ github.ref_name }} — 今日进化：真实自我镜子 + 真话练英文 + 键盘增量对接"
          body: |
            ### v1.3.0 核心升级（随你的表达而进化）
            1. **全新默认首页「今日进化」**：
               - **今日镜子**：承接你的语音输入法每日复盘卡，看清真实注意力分布并支持语音留回声。
               - **今日现场 · 用真话练英文**：直接从你真实发出的中文场景切入，用语音键盘试说英文 → 揭晓母语者意群版（四级 550 分 i+1）→ Kokoro 真人朗读 → 一键存入 FSRS 词库。
               - **个人专属 1 分钟 i+1 微播客 & 兴趣岛**：一键直达精听/精读；支持「导入日包」增量合并，绝不覆盖已有词库。
            2. **开放 Android 增量收词 / 收文接口**：
               - 新增系统 `ACTION_SEND`（`text/plain`）与自定义 `com.lexiflow.app.ACTION_ADD_WORD` 接收通道，为语音键盘一键收词、送精读铺好接口。
            3. **内置离线 Kokoro-82M 真人语音 + 可选 Rime 云端语音 + 应用内一键更新**。
          files: LexiFlow-*.apk
